<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Submit Clips</title>
<!--
  Opened from the ntfy notification (clipper/notify.py). The posts come in the
  URL fragment (#d=<base64url JSON>), which never reaches the server; this
  device remembers them for two days, so the page also works opened directly.
  One tap copies the post's link and opens the campaign: paste, submit, done.
  Each card names the account the post is on, unless it's the default one.
  A post being submitted automatically (submit_clips.py, flag s=1) says so.
-->
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #18181b; --muted: #6b6b73;
    --line: #e4e4e0; --accent: #1f6feb; --accent-text: #ffffff;
    --ok: #1a7f37; --warn: #b4540a; --late: #a1a1aa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --card: #1c1c1f; --text: #ededef; --muted: #9b9ba4;
      --line: #2e2e33; --accent: #4c8dff; --accent-text: #0b0b0d;
      --ok: #3fb950; --warn: #f0883e; --late: #6b6b73;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113; --card: #1c1c1f; --text: #ededef; --muted: #9b9ba4;
    --line: #2e2e33; --accent: #4c8dff; --accent-text: #0b0b0d;
    --ok: #3fb950; --warn: #f0883e; --late: #6b6b73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .card.done { opacity: .55; }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .platform { font-weight: 600; color: var(--text); }
  .left.ok { color: var(--ok); } .left.warn { color: var(--warn); } .left.late { color: var(--late); }
  .title { margin: 6px 0 12px; font-size: 15px; overflow-wrap: anywhere; }
  button, a.button {
    display: block; width: 100%; border: 0; border-radius: 10px; padding: 14px;
    font: inherit; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none;
  }
  .go { background: var(--accent); color: var(--accent-text); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  .row .quiet { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; padding: 10px; }
  .note { font-size: 13px; color: var(--warn); margin: 0 0 8px; }
  .auto { font-size: 13px; color: var(--ok); margin: 0 0 8px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Submit clips</h1>
  <p class="sub">Tap the button: the link is copied and the campaign opens. Paste, submit, then mark it done.</p>
  <div id="list"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const WINDOW_S = 30 * 60, KEEP_S = 2 * 24 * 3600, KEY = "submit-items";
  const NAMES = { instagram: "Instagram", youtube: "YouTube" };
  const now = () => Date.now() / 1000;

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } },
    set(items) { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} },
  };
  const safeUrl = u => typeof u === "string" && /^https:\/\//i.test(u) ? u : "";

  function fromFragment() {
    const m = location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
    if (!m) return [];
    try {
      const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
      const items = JSON.parse(new TextDecoder().decode(bytes));
      return Array.isArray(items) ? items : [];
    } catch { return []; }
  }

  // Merge the notification's posts into what this device remembers.
  const byUrl = new Map(store.get().map(i => [i.u, i]));
  for (const i of fromFragment()) {
    const u = safeUrl(i.u);
    if (!u) continue;
    byUrl.set(u, { ...(byUrl.get(u) || {}), p: String(i.p || ""), u, c: safeUrl(i.c),
                   t: String(i.t || ""), n: String(i.n || ""), a: Number(i.a) || now(),
                   s: i.s ? 1 : 0 });
  }
  let items = [...byUrl.values()].filter(i => now() - i.a < KEEP_S).sort((x, y) => y.a - x.a);
  store.set(items);

  const toast = msg => {
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600);
  };

  function copy(text) {
    // Synchronous fallback first-class: it keeps the tap's user gesture for window.open.
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
    return true;
  }

  function update(u, patch) {
    items = items.map(i => i.u === u ? { ...i, ...patch } : i);
    store.set(items); render();
  }

  function timeLeft(i) {
    const left = Math.floor((i.a + WINDOW_S - now()) / 60);
    if (left > 10) return [`${left} min left`, "ok"];
    if (left > 0) return [`${left} min left`, "warn"];
    return ["window passed", "late"];
  }

  function el(tag, attrs = {}, text) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    const list = document.getElementById("list");
    list.replaceChildren();
    if (!items.length) {
      list.append(el("p", { class: "empty" }, "Nothing to submit. Notifications open this page with the new posts."));
      return;
    }
    for (const i of items) {
      const card = el("div", { class: "card" + (i.done ? " done" : "") });
      const meta = el("div", { class: "meta" });
      const [left, cls] = i.done ? ["submitted", "ok"] : timeLeft(i);
      // The account it's on, for a named account: "Gaming · Instagram".
      const platform = NAMES[i.p] || i.p || "Post";
      meta.append(el("span", { class: "platform" }, i.n ? `${i.n} · ${platform}` : platform),
                  el("span", { class: "left " + cls }, left));
      card.append(meta, el("p", { class: "title" }, i.t || i.u));
      if (i.s && !i.done) {
        // submit_clips.py on the Mac is on it; a failure sends a new reminder without this flag.
        card.append(el("p", { class: "auto" },
          "Will be submitted automatically. Submit by hand only if no confirmation came."));
      }

      if (i.c) {
        const go = el("button", { class: "go", type: "button" }, "Copy link & open campaign");
        go.addEventListener("click", () => {
          copy(i.u);
          window.open(i.c, "_blank", "noopener");
          toast("Link copied");
          update(i.u, { opened: true });
        });
        card.append(go);
      } else {
        card.append(el("p", { class: "note" }, "No campaign link: add a \"Submit:\" line to the brief."));
        const cp = el("button", { class: "go", type: "button" }, "Copy link");
        cp.addEventListener("click", () => { copy(i.u); toast("Link copied"); });
        card.append(cp);
      }

      const row = el("div", { class: "row" });
      const view = el("a", { class: "button quiet", href: i.u, target: "_blank", rel: "noopener" }, "View post");
      const done = el("button", { class: "quiet", type: "button" }, i.done ? "Undo" : "Mark done");
      done.addEventListener("click", () => update(i.u, { done: !i.done }));
      row.append(view, done);
      card.append(row);
      list.append(card);
    }
  }

  render();
  // Clean URL: the posts are stored now, so a reload doesn't need the fragment.
  if (location.hash) history.replaceState(null, "", location.pathname);
  setInterval(render, 30000);
})();
</script>
</body>
</html>
